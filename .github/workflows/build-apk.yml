name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'feature/**'
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'      # 忽略所有 markdown 文件的更改
      - 'LICENSE'    # 忽略许可文件的更改
      - 'docs/**'    # 忽略文档目录
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Release Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release.jks
            if [ ! -s app/release.jks ]; then
              echo "::error::KEYSTORE_BASE64 was provided but base64 decoding failed or produced an empty file!"
              exit 1
            fi
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "::error::Release tag build requires secret KEYSTORE_BASE64 to guarantee consistent APK signatures!"
            exit 1
          else
            echo "::warning::KEYSTORE_BASE64 is not set; generating development fallback release keystore"
            keytool -genkey -v -keystore app/release.jks -alias biliaccelerator -keyalg RSA -keysize 2048 -validity 10000 -storepass biliaccelerator -keypass biliaccelerator -dname "CN=BiliAccelerator, OU=Dev, O=BiliAccelerator, L=SH, ST=SH, C=CN"
          fi
          echo "Keystore ready: $(wc -c < app/release.jks) bytes"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Run Lint & Unit Tests
        run: |
          ./gradlew lintDebug testDebugUnitTest --stacktrace 2>&1 | tee build.log || {
            ERR=$(grep -E "(e: |error:|FAILURE:)" build.log | head -n 20 | tr '\n' ' ')
            echo "::error::Gradle Error: $ERR"
            tail -n 100 build.log
            exit 1
          }

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace > release.log 2>&1 || true
          cat release.log | tail -n 50
          if grep -q "BUILD FAILED" release.log; then
            ERR=$(grep -E "(e: |error:|FAILURE:|FAILED|Exception:)" release.log | head -n 30 | tr '\n' ' ' | tr '\r' ' ')
            echo "::error::Release build failed: $ERR"
            exit 1
          fi
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare APK Artifacts
        id: prepare_artifact
        run: |
          mkdir -p outputs
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION_TAG="${{ github.ref_name }}"
          if [[ "$VERSION_TAG" == v* ]]; then
            NAME="BiliAccelerator-${VERSION_TAG}.apk"
          else
            NAME="BiliAccelerator-${SHORT_SHA}.apk"
          fi
          APK_FILE=$(find app/build/outputs -name "*release*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK found! Outputs directory listing:"
            find app/build/outputs -type f || true
            exit 1
          fi
          cp "$APK_FILE" "outputs/${NAME}"
          echo "artifact_name=${NAME}" >> $GITHUB_OUTPUT
          echo "Generated APK: outputs/${NAME} (from $APK_FILE)"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.artifact_name }}
          path: outputs/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: outputs/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
